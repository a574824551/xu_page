worker_processes auto;
pid /run/personal-site/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    include /etc/personal-site/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    access_log /var/log/nginx/access.log;
    client_body_temp_path /var/cache/personal-site/client_temp;
    proxy_temp_path /var/cache/personal-site/proxy_temp;
    fastcgi_temp_path /var/cache/personal-site/fastcgi_temp;
    uwsgi_temp_path /var/cache/personal-site/uwsgi_temp;
    scgi_temp_path /var/cache/personal-site/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name xujinghui.com.cn www.xujinghui.com.cn;
        root /var/www/xujinghui.com.cn/current;
        index index.html;
        autoindex off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/personal-site/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://xujinghui.com.cn$request_uri;
        }

        location ~ /\. {
            return 404;
        }
    }

    # TLS is terminated by the existing 443 service. These listeners are local only.
    server {
        listen 127.0.0.1:18080 proxy_protocol;
        listen 127.0.0.1:18081 http2 proxy_protocol;
        server_name xujinghui.com.cn www.xujinghui.com.cn;
        root /var/www/xujinghui.com.cn/current;
        index index.html;
        autoindex off;

        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        if ($host = www.xujinghui.com.cn) {
            return 301 https://xujinghui.com.cn$request_uri;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ /\. {
            return 404;
        }
    }
}
